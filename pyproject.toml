[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI-afhankelijkheden in standaardwaarden
  "E731",  # korte lambda's binnen een functie lezen prima
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405", "B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
